<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh tương tác</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Thư Viện Ảnh Tương Tác</h1>
        
        <!-- Yêu cầu: Vùng ảnh lớn ban đầu chứa văn bản gốc và background trống -->
        <div id="image">
            Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.
        </div>

        <!-- Yêu cầu: Ít nhất 6 hình ảnh với alt text khác nhau. Tabindex KHÔNG được code cứng ở đây -->
        <div id="thumbnails">
            <img class="preview" src="https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?w=400" alt="Phong cảnh núi non hùng vĩ ở đằng xa">
            <img class="preview" src="https://images.unsplash.com/photo-1682687982501-1e58f81bef68?w=400" alt="Bãi biển hoang sơ tuyệt đẹp lúc hoàng hôn">
            <img class="preview" src="https://images.unsplash.com/photo-1682687219640-b3f11f4b7234?w=400" alt="Đồi núi trập trùng dưới bầu trời mây trắng">
            <img class="preview" src="https://images.unsplash.com/photo-1682695796954-bad0d0f59ff1?w=400" alt="Kiến trúc hiện đại tuyệt đẹp của thành phố">
            <img class="preview" src="https://images.unsplash.com/photo-1682687220063-4742bd7fd538?w=400" alt="Rừng thông tĩnh lặng chìm trong sương mù">
            <img class="preview" src="https://images.unsplash.com/photo-1682695797595-eb4928282f1f?w=400" alt="Những tảng đá khổng lồ kỳ vĩ trên sa mạc">
        </div>
    </main>

    <!-- Nạp file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
